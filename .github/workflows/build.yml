name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" scripts/build-app.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MacSweep
          path: build/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --generate-notes
