name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$FILE_VERSION" ]]; then
              echo "::error::Il tag ($VERSION) non corrisponde al file VERSION ($FILE_VERSION)"
              exit 1
            fi
          else
            VERSION="$FILE_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: VERSION="${{ steps.version.outputs.version }}" scripts/build-app.sh --zip --dmg

      - name: Checksums
        run: |
          cd build
          shasum -a 256 MacSweep-*.zip MacSweep-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MacSweep-${{ steps.version.outputs.version }}
          path: |
            build/*.zip
            build/*.dmg
            build/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release già pubblicata (scripts/release.sh --local): nulla da fare."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" build/*.zip build/*.dmg build/SHA256SUMS.txt \
            --title "MacSweep ${{ steps.version.outputs.version }}" --generate-notes
